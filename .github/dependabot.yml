version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    groups:
      dev-tooling:
        patterns: ["*"]
    ignore:
      # Test oracle, pinned: bumped by hand, with its list of divergences reviewed.
      - dependency-name: "@sdxc/jscontact"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
