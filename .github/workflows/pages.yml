name: Deploy to GitHub Pages

# Deploys only commits on main whose CI run succeeded.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm build
      # Shields endpoint behind the README coverage badge; after the build, which empties dist.
      - run: |
          jq '.total.lines.pct as $pct | {
                schemaVersion: 1, label: "coverage", message: "\($pct | floor)%",
                color: (if   $pct >= 95 then "brightgreen"
                        elif $pct >= 90 then "green"
                        elif $pct >= 85 then "yellowgreen"
                        else "yellow" end)
              }' coverage/coverage-summary.json > apps/web/dist/coverage.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
